name: City story slice checks

on:
  push:
    branches:
      - feat/interactive-city-stories-v1
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript
        run: npm run check
      - name: Story content references
        run: npm run content:validate
      - name: City story regression tests
        run: npm run test:city-case
      - name: Build web version
        run: npm run build
