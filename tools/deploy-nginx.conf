# 二十五时便利屋 — 国内服务器静态托管配置
# 放到服务器: /etc/nginx/conf.d/xiashan.conf  然后 nginx -t && nginx -s reload
# 用 8080 端口(避开 80/443 的未备案拦截,IP 直连可用)

server {
    listen 8080;
    server_name _;                      # 用 IP 访问,不需要域名

    root /var/www/xiashan;              # 把 deploy/ 里的内容传到这里
    index index.html;

    # HashRouter 用 #/ 路由,静态文件直接命中即可,无需 SPA 回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 音视频/图片长缓存(回访不重复下载)
    location ~* \.(png|jpg|jpeg|webp|svg|mp4|mp3|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # 开 gzip(对 js/json/css 有效,图片视频本身已压缩)
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
